slug: nvidia-nim
name: NVIDIA NIM
url: https://www.nvidia.com
category: managed-selfhost
tagline: Self-hosted NIM inference microservices licensed per GPU via NVIDIA AI Enterprise

last_verified: "2026-10-17"
sources:
  - https://www.nvidia.com/en-us/ai-trust-center/security-compliance/
  - https://www.nvidia.com/en-us/agreements/data-processing-addendum/nvidia-cloud-services-data-processing-addendum/
  - https://docs.nvidia.com/ai-enterprise/planning-resource/licensing-guide/latest/pricing.html
  - https://www.nvidia.com/en-us/about-nvidia/privacy-policy/
  - https://docs.api.nvidia.com/nim/docs/run-anywhere

deployment_models:
  - self-hosted-containers
  - dedicated-endpoints
  - nvidia-hosted-api
  - dgx-cloud

# Regions not applicable as a vendor list. NIM is "run anywhere" software:
# customer-run containers on any NVIDIA GPU (cloud, data centre, workstation),
# CSP model gardens, partner endpoints, or the NVIDIA-hosted API. NVIDIA
# publishes no product region list, so deployment geography is set by the
# customer's own infrastructure, not by NVIDIA. Source:
# https://docs.api.nvidia.com/nim/docs/run-anywhere checked 2026-07-13,
# re-checked 2026-10-17.
regions: []

compliance:
  - cert: ISO27001
    evidence_url: https://www.nvidia.com/en-us/ai-trust-center/security-compliance/
    verified: "2026-10-17"
  - cert: GDPR_DPA
    evidence_url: https://www.nvidia.com/en-us/agreements/data-processing-addendum/nvidia-cloud-services-data-processing-addendum/
    verified: "2026-10-17"

pricing:
  model: NVIDIA AI Enterprise per GPU ($4,500/GPU/year self-managed; $1/GPU/hour in cloud marketplaces plus CSP instance costs)
  public: true
  evidence_url: https://docs.nvidia.com/ai-enterprise/planning-resource/licensing-guide/latest/pricing.html
  verified: "2026-10-17"

sovereignty:
  data_residency_guarantee: unknown
  parent_jurisdiction: US
  evidence_url: https://www.nvidia.com/en-us/about-nvidia/privacy-policy/
  verified: "2026-10-17"

notes: >-
  NIM containers self-host GPU-accelerated inference microservices for
  pretrained and customized models; production use is licensed via NVIDIA AI
  Enterprise. Dedicated endpoints are available through partners including
  Hugging Face; DGX Cloud pricing is via private marketplace offers. AI Trust
  Center lists ISO 27001; SOC 2 type not specified. Cloud Services DPA
  includes SCCs.

featured: false
