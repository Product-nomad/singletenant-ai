deployment_models:
  - self-hosted-containers
  - dedicated-endpoints
  - nvidia-hosted-api
  - dgx-cloud

# Regions not applicable as a vendor list. NIM is "run anywhere" software:
# customer-run containers on any NVIDIA GPU (cloud, data centre, workstation),
# CSP model gardens, partner endpoints, or the NVIDIA-hosted API. NVIDIA
# publishes no product region list, so deployment geography is set by the
# customer's own infrastructure, not by NVIDIA. Source:
# https://docs.api.nvidia.com/nim/docs/run-anywhere checked 2026-07-13,
# re-checked 2026-10-17.
regions: []

compliance:
  - cert: ISO27001
    level: stated
    evidence_url: https://www.nvidia.com/en-us/ai-trust-center/security-compliance/
    verified: "2026-10-17"
  - cert: GDPR_DPA
    level: contractual
    evidence_url: https://www.nvidia.com/en-us/agreements/data-processing-addendum/nvidia-cloud-services-data-processing-addendum/
    verified: "2026-10-17"

pricing:
  model: NVIDIA AI Enterprise per GPU ($4,500/GPU/year self-managed; $1/GPU/hour in cloud marketplaces plus CSP instance costs)
  public: true
  evidence_url: https://docs.nvidia.com/ai-enterprise/planning-resource/licensing-guide/latest/pricing.html
  verified: "2026-10-17"

sovereignty:
  data_residency_guarantee: unknown
  parent_jurisdiction: US
  evidence_url: https://www.nvidia.com/en-us/about-nvidia/privacy-policy/
  verified: "2026-10-17"

notes: >-
  NIM containers self-host inference microservices, licensed for production
  via NVIDIA AI Enterprise. Dedicated deployments run in CSP model gardens, on
  NVIDIA Brev instances, or as private VPC endpoints via NVIDIA Cloud
  Functions; Hugging Face offers selected serverless NIM endpoints. AI Trust
  Center lists ISO 27001; SOC 2 type not specified. Cloud Services DPA
  includes SCCs.

featured: false
