notes: >-
  Provisioned Throughput reserves per-model capacity in Model Units (MUs),
  billed hourly with no-commitment, 1-month, or 6-month terms; required for
  serving customised models. AWS states Bedrock content is stored at rest in
  the Region of use and not shared with model providers. Example per-MU rates
  are published for some models; most quotes require an AWS account team.

