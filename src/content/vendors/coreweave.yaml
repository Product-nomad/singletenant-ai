notes: >-
  Security page states every CKS node is single-tenant; CKS runs Kubernetes
  directly on bare-metal nodes without a hypervisor. SOC 2 Type II scope covers
  Bare Metal and CKS. Trust centre shows ISO 27001/27017/27018 badges but the
  security page uses "aligned with" wording, so ISO 27001 is excluded
  (https://www.coreweave.com/security). Terms name CoreWeave, Inc. under New
  York law.

