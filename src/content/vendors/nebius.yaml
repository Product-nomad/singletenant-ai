notes: >-
  Token Factory offers shared or single-tenant endpoints with optional
  regional deployment in EU or US data centers (Finland, France, US).
  Non-US customers contract with Nebius B.V. under Dutch law; US Token
  Factory customers registering from 15 Sep 2026 contract with Nebius Inc.
  PHI use requires a signed BAA (HIPAA guideline). Per-token prices require
  sign-in.

