# Regions verified 2026-07-12 and re-checked 2026-10-17 against
# https://huggingface.co/docs/inference-endpoints/en/faq which names AWS
# us-east-1 / eu-west-1, Azure eastus and GCP us-east4. No Asia-Pacific region.
regions:
  - us
  - europe

compliance:
  - cert: SOC2_TYPE2
    level: stated
    evidence_url: https://huggingface.co/docs/inference-endpoints/security
    verified: "2026-10-17"
  - cert: GDPR_DPA
    level: stated
    evidence_url: https://huggingface.co/docs/inference-endpoints/security
    verified: "2026-10-17"

pricing:
  model: Per instance-hour (CPU, GPU, and accelerator instances); dedicated inference from $0.033/hour
  public: true
  evidence_url: https://huggingface.co/pricing
  verified: "2026-10-17"

sovereignty:
  data_residency_guarantee: unknown
  parent_jurisdiction: US
  evidence_url: https://huggingface.co/privacy
  verified: "2026-10-17"

notes: >-
  Deploys Hub models on managed instances across AWS, Azure, and GCP with
  public, protected, or private (intra-region AWS/Azure PrivateLink) access.
  Vendor docs state SOC 2 Type 2 certification and a GDPR DPA via Enterprise
  Hub subscription, and that payloads are not stored (logs kept 30 days).
  Privacy policy: data may be stored in the US.

featured: false
