# Regions verified 2026-07-12 against
# https://modal.com/docs/guide/region-selection which documents region pinning
# across US (us), Europe (eu) and Asia-Pacific (ap) plus narrower zones.
regions:
  - us
  - europe
  - apac

compliance:
  - cert: SOC2_TYPE2
    evidence_url: https://modal.com/docs/guide/security
    verified: "2026-07-07"
  - cert: HIPAA_BAA
    evidence_url: https://modal.com/docs/guide/security
    verified: "2026-07-07"

pricing:
  model: Per-second GPU, CPU core, and memory billing
  public: true
  evidence_url: https://modal.com/pricing
  verified: "2026-07-07"

sovereignty:
  data_residency_guarantee: true
  parent_jurisdiction: US
  evidence_url: https://modal.com/legal/terms
  verified: "2026-07-07"

notes: >-
  Terms commit to processing customer data only in customer-specified regions.
  HIPAA BAA is Enterprise-plan only, and scoped (Volumes v2 in, some features
