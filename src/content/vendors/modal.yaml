slug: modal
name: Modal
url: https://modal.com
category: dedicated-gpu
tagline: Serverless GPU compute billed per second, with region pinning

last_verified: "2026-07-07"
sources:
  - https://modal.com/docs/guide/security
  - https://modal.com/pricing
  - https://modal.com/legal/terms
  - https://modal.com/docs/guide/region-selection

deployment_models:
  - serverless

# Regions re-checked 2026-07-18 against
# https://modal.com/docs/guide/region-selection which documents region pinning
# across US (us), the EEA (eu -> europe), the UK (uk) and Asia-Pacific (ap) plus
# narrower zones. Modal lists uk as a broad region distinct from eu; it was
# omitted before the uk bucket existed.
regions:
  - us
  - uk
  - europe
  - apac

compliance:
  - cert: SOC2_TYPE2
    evidence_url: https://modal.com/docs/guide/security
    verified: "2026-07-07"
  - cert: HIPAA_BAA
    evidence_url: https://modal.com/docs/guide/security
    verified: "2026-07-07"

pricing:
  model: Per-second GPU, CPU core, and memory billing
  public: true
  evidence_url: https://modal.com/pricing
  verified: "2026-07-07"

sovereignty:
  data_residency_guarantee: true
  parent_jurisdiction: US
  evidence_url: https://modal.com/legal/terms
  verified: "2026-07-07"

notes: >-
  Terms commit to processing customer data only in customer-specified regions.
  HIPAA BAA is Enterprise-plan only, and scoped (Volumes v2 in, some features
  out). No dedicated/single-tenant tier on the public pricing page at review.

featured: true
