# Regions re-checked 2026-07-18 and 2026-10-17 against
# https://modal.com/docs/guide/region-selection which documents region pinning
# across US (us), the EEA (eu -> europe), the UK (uk) and Asia-Pacific (ap) plus
# narrower zones. Modal lists uk as a broad region distinct from eu; it was
# omitted before the uk bucket existed.
regions:
  - US
  - GB
  - EU
  - APAC

compliance:
  - cert: SOC2_TYPE2
    level: contractual
    evidence_url: https://trust.modal.com/
    verified: "2026-10-17"

pricing:
  model: Per-second GPU, CPU core, and memory billing
  public: true
  evidence_url: https://modal.com/pricing
  verified: "2026-10-17"

sovereignty:
  data_residency_guarantee: contractual
  parent_jurisdiction: US
  evidence_url: https://modal.com/legal/terms
  verified: "2026-10-17"

notes: >-
  Terms commit to processing customer data only in customer-specified regions.
  HIPAA is offered on the Enterprise plan (Volumes v2 in scope, some features
  out); no BAA wording was found. Dedicated Endpoints run models on isolated,
  autoscaling containers at standard compute rates; the pricing page lists no
  separate dedicated tier.

featured: true
