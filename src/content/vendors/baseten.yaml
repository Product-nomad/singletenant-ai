# Regions re-checked 2026-10-17. The regional-deployments doc lists two
# selectable regions, us (United States) and eu (European Union), and says to
# contact support for any other. The UK and Australia regions the
# regional-environments doc named on 2026-07-18 are no longer listed there, so
# uk and apac were removed. Source:
# https://docs.baseten.co/deployment/regional-deployments
# Regions carry no evidence field in schema v2.
