  verified: "2026-11-24"

notes: >-
  Baseten documents a Single-tenant hosting option (dedicated, fully managed
  infrastructure with isolated compute and networking) and Self-hosted, which
  keeps inference payloads in the customer's VPC. Trust centre lists ISO
  27001:2022, SOC 2 Type 2 and SOC 3. Regional deployments pin replicas to
  the US or EU; no contractual residency guarantee found. Support-enabled
  egress allow-lists restrict outbound traffic.

featured: true
