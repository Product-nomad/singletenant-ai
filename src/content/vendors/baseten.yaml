notes: >-
  Dedicated deployments and an enterprise self-hosted option position Baseten
  for single-tenant use. Trust centre lists ISO 27001:2022 alongside SOC 2
  Type 2 and SOC 3. Regional deployments pin replicas to the US or EU, but no
  contractual data-residency guarantee found at review; trust centre lists
  subprocessors across multiple clouds.

