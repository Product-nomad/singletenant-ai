slug: baseten
name: Baseten
url: https://www.baseten.co
category: dedicated-gpu
tagline: Inference platform with dedicated deployments, self-hosted and hybrid options

deployment_models:
  - dedicated-deployment
  - self-hosted
  - hybrid

# Regions populated (us/europe/apac) from the regional-environments docs, which
# name US, EU, UK and Australia as configurable regions for routing inference
# in-region to meet data residency (EU+UK -> europe, Australia -> apac). List is
# described as non-exhaustive. Source:
# https://docs.baseten.co/deployment/regional-environments checked 2026-07-13.
# Regions carry no evidence field in schema v2.
regions:
  - us
  - europe
  - apac

compliance:
  - cert: SOC2_TYPE2
    evidence_url: https://trust.baseten.co
    verified: "2026-07-07"
  - cert: SOC3
    evidence_url: https://trust.baseten.co
    verified: "2026-07-07"
  - cert: HIPAA_BAA
    evidence_url: https://trust.baseten.co
    verified: "2026-07-07"
  - cert: GDPR_DPA
    evidence_url: https://trust.baseten.co
    verified: "2026-07-07"

pricing:
  model: Per 1M tokens (Model APIs); per-minute GPU/CPU instances for dedicated deployments
  public: true
  evidence_url: https://www.baseten.co/pricing
  verified: "2026-07-07"

sovereignty:
  data_residency_guarantee: unknown
  parent_jurisdiction: US
  evidence_url: https://www.baseten.co/terms-and-conditions/
  verified: "2026-07-07"

notes: >-
  Dedicated deployments and an enterprise self-hosted option position Baseten
  for single-tenant use. No public data-residency guarantee found at review;
  trust centre lists subprocessors across multiple clouds.

featured: true
