description_short: |
  Open-source LLM platform with shared API, dedicated endpoints, and single-tenant
  options. Strong cost economics at scale.

description_long: |
  Together AI runs one of the most heavily used open-source model APIs on the
  market. Founded in 2022, it has grown rapidly on the back of the open-source
  model thesis: that companies will increasingly prefer open-weight models like
  Llama and Mistral over closed ones from OpenAI or Anthropic, particularly at
  scale.

  The platform offers a tiered deployment model. The shared API is the entry
  point — pay-per-token, OpenAI-compatible, no commitment. Dedicated endpoints
  add reserved GPU capacity with predictable performance. Single-tenant and VPC
  deployments are available for customers with compliance requirements or
  workload isolation needs.

  Together's strength is volume economics. For teams running 10M+ tokens per day,
  the per-token costs on dedicated capacity often beat both shared-API providers
  (OpenAI, Anthropic) and self-hosted alternatives once GPU and engineering costs
  are factored in.

