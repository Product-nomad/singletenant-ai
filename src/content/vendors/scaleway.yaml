notes: >-
  Generative APIs Dedicated Deployment (formerly Managed Inference) runs
  models on dedicated GPUs at fixed hourly rates
  (e.g. Llama 3.1-8b at 0.93 EUR/hour) inside a VPC; prompts and responses
  are stated as stored only in Europe. Scaleway SAS is registered in Paris,
  France. Security page lists SecNumCloud as ongoing
  ("currently undergoing qualification"); not yet qualified. Serverless
  tier prices cached tokens separately.

