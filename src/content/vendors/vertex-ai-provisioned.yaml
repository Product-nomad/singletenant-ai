# Regions populated (us/europe/apac) from the Vertex AI locations page, which
# lists supported model regions across the US (e.g. us-central1), Europe (e.g.
# europe-west1/2/4) and Asia-Pacific (e.g. asia-east1, asia-northeast1). Google
# publishes no PT-specific region list; Provisioned Throughput runs wherever its
# supported models are available, so these buckets are derived from the model
# region list rather than a PT-specific one. Source:
# https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/locations
# checked 2026-07-13; re-checked 2026-10-17 after the page moved to the Gemini
# Enterprise Agent Platform docs.
