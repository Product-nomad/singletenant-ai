pricing_model: Per-second billing on GPU-hour basis. Community Cloud (cheaper,
  individual providers globally) and Secure Cloud (enterprise-grade data centres)
starts_from: ~$0.34/hr (RTX 4090, Community Cloud); ~$0.89/hr (A100, Community)
minimum_commitment: None — strict pay-per-second

sweet_spot: |
  Cost-sensitive teams running batch inference, model fine-tuning, or
  experimentation. Particularly strong for prototyping and bursty workloads
  where commodity GPU access matters more than enterprise tooling.

weakness: |
  Less suitable for production customer-facing inference where strict SLAs
  and observability are required. Cold starts on serverless can be 15-30s.
  Community Cloud has variable reliability.

description_short: |
  Commodity GPU cloud with per-second pricing, popular for cost-conscious AI/ML
  teams who don't need full managed inference tooling.

description_long: |
  RunPod has become a default choice for AI developers and small teams who need
  affordable GPU compute without the markup of AWS/GCP/Azure. Its model is
  straightforward: aggregate GPU capacity globally, expose it via a simple API
  and web UI, and bill by the second.

  The platform offers two tiers. Community Cloud sources GPUs from individual
  providers worldwide at prices typically 60-80% below the hyperscalers. Secure
  Cloud runs on RunPod's own data-centre infrastructure with enterprise-grade
  reliability and compliance. The serverless option layers autoscaling and
  scale-to-zero on top, with the trade-off of cold starts.

  RunPod is one of the few vendors in this space with a transparent, public
  affiliate programme: 3-5% commission on referral spend for the first six
  months, scaling to 10% via Partnerstack after 25 referrals. This makes it
  an attractive baseline affiliate for content publishers in the niche.

