notes: >-
  AI Endpoints is a serverless per-token API (more than 20 open-weight
  models), hosted in the EU, keeping only data needed for billing; AI Deploy
  runs customer Docker images and models. Compliance page lists SecNumCloud
  (ANSSI), BSI C5, ISO 27001 and GDPR compliance. Parent OVH Groupe SA is
  registered in Lille, France. No contractual AI-product residency guarantee
  found.

