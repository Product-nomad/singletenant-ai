# Sovereign for: parent in the jurisdiction, capacity there, a residency
# commitment, and the vendor's own sovereignty claim (sources dated 2026-10-22).
sovereign_for:
  - EU

notes: >-
  AI Endpoints is a serverless per-token API (more than 20 open-weight
  models), hosted in the EU; AI Deploy runs customer Docker images and models.
  Public Cloud terms let the customer choose the datacentre region.
  SecNumCloud covers named private-cloud and bare-metal products, not the AI
  services, so it is not listed. Parent OVH Groupe SA is registered in Lille.

