notes: >-
  Civo Limited is UK-registered (Companies House 09568551); its sole person
  with significant control is a UK-resident individual, with no foreign parent.
  Bare-metal GPU compute is offered, and the FlexCore private cloud supports
  GPU passthrough. The UK Sovereign Cloud page
  states data stays in the UK under UK law only, contrasting the US CLOUD Act.

