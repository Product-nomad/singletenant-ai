notes: >-
  Mosaic AI Model Serving deploys custom MLflow models and fine-tuned
  foundation models on Databricks-managed serverless compute; provisioned
  throughput allocates dedicated inference capacity. Trust pages list ISO
  27001:2022 (including AWS single-tenant), SOC 2 Type II report on request,
  HIPAA options, FedRAMP Moderate/High; a standard BAA is published. DPA with
  SCCs published. Databricks, Inc. is headquartered in San Francisco.

