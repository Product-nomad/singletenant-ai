pricing:
  model: Per DBU per hour by GPU instance size (e.g. A10G 20 DBU/hour); per-token Foundation Model APIs
  public: true
  evidence_url: https://www.databricks.com/product/pricing/model-serving
  verified: "2026-10-17"

sovereignty:
  data_residency_guarantee: stated
  parent_jurisdiction: US
  evidence_url: https://docs.databricks.com/aws/en/resources/databricks-geos
  verified: "2026-10-17"

notes: >-
  Model Serving deploys custom MLflow models and fine-tuned
  foundation models on Databricks-managed serverless compute; provisioned
  throughput allocates dedicated inference capacity. Trust pages list ISO
  27001:2022 (including AWS single-tenant), SOC 2 Type II, HIPAA options and
  FedRAMP Class C and D (formerly Moderate and High). A standard BAA and a DPA
  with SCCs are published.

featured: false
