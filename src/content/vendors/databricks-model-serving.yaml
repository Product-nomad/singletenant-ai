slug: databricks-model-serving
name: Databricks Model Serving
url: https://www.databricks.com
category: managed-selfhost
tagline: Serverless serving of custom and foundation models with provisioned throughput

last_verified: "2026-10-17"
sources:
  - https://www.databricks.com/trust/compliance/soc
  - https://www.databricks.com/trust/compliance/iso-27001
  - https://www.databricks.com/legal/baa
  - https://www.databricks.com/trust/compliance/fedramp
  - https://www.databricks.com/legal/dpa
  - https://www.databricks.com/product/pricing/model-serving
  - https://www.databricks.com/legal/privacynotice
  - https://docs.databricks.com/aws/en/machine-learning/model-serving/model-serving-limits
  - https://docs.databricks.com/aws/en/resources/feature-region-support

deployment_models:
  - custom-model-serving
  - provisioned-throughput
  - pay-per-token-endpoints

# Regions re-checked 2026-10-17. The limits page now links out to the Model
# serving features availability table at
# https://docs.databricks.com/aws/en/resources/feature-region-support which, for
# AWS, shows Custom Model Serving with GPU and provisioned throughput in US,
# EU (Frankfurt, Ireland), EU (London) and Asia-Pacific regions. London names a
# UK location, so uk is recorded alongside europe.
regions:
  - us
  - uk
  - europe
  - apac

compliance:
  - cert: SOC2_TYPE2
    evidence_url: https://www.databricks.com/trust/compliance/soc
    verified: "2026-10-17"
  - cert: ISO27001
    evidence_url: https://www.databricks.com/trust/compliance/iso-27001
    verified: "2026-10-17"
  - cert: HIPAA_BAA
    evidence_url: https://www.databricks.com/legal/baa
    verified: "2026-10-17"
  - cert: FEDRAMP
    evidence_url: https://www.databricks.com/trust/compliance/fedramp
    verified: "2026-10-17"
  - cert: GDPR_DPA
    evidence_url: https://www.databricks.com/legal/dpa
    verified: "2026-10-17"

pricing:
  model: Per DBU per hour by GPU instance size (e.g. A10G 20 DBU/hour); per-token Foundation Model APIs
  public: true
  evidence_url: https://www.databricks.com/product/pricing/model-serving
  verified: "2026-10-17"

sovereignty:
  data_residency_guarantee: unknown
  parent_jurisdiction: US
  evidence_url: https://www.databricks.com/legal/privacynotice
  verified: "2026-10-17"

notes: >-
  Mosaic AI Model Serving deploys custom MLflow models and fine-tuned
  foundation models on Databricks-managed serverless compute; provisioned
  throughput allocates dedicated inference capacity. Trust pages list ISO
  27001:2022 (including AWS single-tenant), SOC 2 Type II, HIPAA options and
  FedRAMP Class C and D (formerly Moderate and High). A standard BAA and a DPA
  with SCCs are published.

featured: false
